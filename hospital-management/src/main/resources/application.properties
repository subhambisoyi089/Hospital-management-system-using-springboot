spring.application.name=hospital-management
server.port=8081
server.servlet.session.timeout=60m

# Name shown in the sidebar, login page and slips - change it
hospital.name=City Care Hospital

# JSP views live in WEB-INF so they can't be opened directly
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
spring.mvc.ignore-default-model-on-redirect=true

# Date and time fields from HTML forms (yyyy-MM-dd and HH:mm)
spring.mvc.format.date=iso
spring.mvc.format.time=iso

# H2 file database, kept in the ./data folder so records survive a restart
spring.datasource.url=jdbc:h2:file:./data/hospitaldb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# First-run passwords (usernames: admin, receptionist). Override with environment variables.
app.admin.password=${ADMIN_PASSWORD:admin123}
app.receptionist.password=${RECEPTIONIST_PASSWORD:rec123}

logging.level.com.hospital=INFO
